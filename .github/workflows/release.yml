name: Release evidence

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build-and-attach-evidence:
    name: Build release and evidence pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --editable .
      - name: Build distributions
        run: python -m hatchling build --target wheel,sdist
      - name: Generate bill of materials
        run: cyclonedx-py environment --output-reproducible --output-file dist/bom.json
      - name: Assemble evidence pack
        run: |
          tar --create --gzip --file evidence-pack.tar.gz dist
          mv evidence-pack.tar.gz dist/evidence-pack.tar.gz
      - name: Publish release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-pack
          path: dist
          if-no-files-found: error
      - name: Attach release evidence
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
