name: Security scans

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  dependency-and-secret-scans:
    name: Dependency and secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --editable .
      - name: Scan dependencies
        run: |
          mkdir -p security-reports
          set +e
          python -m pip_audit --requirement requirements.lock --strict --format json --output security-reports/pip-audit.json
          audit_status=$?
          cat security-reports/pip-audit.json
          if [[ $audit_status -ne 0 ]]; then
            echo "::error title=Dependency vulnerability::pip-audit reported the advisory above."
            exit "$audit_status"
          fi
      - name: Scan source code at high severity
        run: |
          mkdir -p security-reports
          set +e
          python -m bandit --recursive src --severity-level high --format json --output security-reports/bandit.json
          bandit_status=$?
          cat security-reports/bandit.json
          if [[ $bandit_status -ne 0 ]]; then
            echo "::error title=High-severity source finding::Bandit reported the finding above."
            exit "$bandit_status"
          fi
      - name: Scan for secrets
        run: python -m pre_commit run detect-secrets --all-files --show-diff-on-failure
      - name: Publish security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports
          if-no-files-found: warn
