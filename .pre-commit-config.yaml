default_language_version:
  python: python3.12
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: python
        types: [python]
        additional_dependencies: [ruff==0.9.10]
      - id: ruff-lint
        name: ruff lint
        entry: ruff check
        language: python
        types: [python]
        additional_dependencies: [ruff==0.9.10]
      - id: mypy
        name: mypy
        entry: mypy src
        language: python
        pass_filenames: false
        types: [python]
        additional_dependencies: [mypy==1.14.1]
      - id: detect-secrets
        name: detect secrets
        entry: detect-secrets-hook
        language: python
        types: [text]
        additional_dependencies: [detect-secrets==1.5.0]
