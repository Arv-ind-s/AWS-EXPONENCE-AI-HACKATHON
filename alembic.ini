# Alembic configuration for Covenant Radar (`T-010`).
#
# `sqlalchemy.url` is deliberately left blank: `db/migrations/env.py`
# resolves the real URL from the application's own settings
# (`config/settings.py`), the same configuration precedence every other
# entry point uses, so this file never carries a second, competing source
# of truth for where the database lives. `radarctl migrate` overrides it
# with `--database-url` when a caller (chiefly `tests/migration`) needs a
# database other than the configured one.

[alembic]
script_location = src/covenant_radar/db/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
