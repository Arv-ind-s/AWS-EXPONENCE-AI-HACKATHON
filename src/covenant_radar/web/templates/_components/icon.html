{% macro icon(name, label="") -%}
  <svg class="icon icon--{{ name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"{% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %} focusable="false">
    {% if name == "radar" %}
      <circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle><path d="M12 12 18.4 5.6"></path>
    {% elif name == "menu" %}
      <path d="M4 7h16M4 12h16M4 17h16"></path>
    {% elif name == "queue" %}
      <path d="M4 5h16v5H4zM4 14h7v5H4zM15 14h5v5h-5z"></path>
    {% elif name == "case" %}
      <path d="M8 6V4h8v2M4 7h16v12H4zM4 11h16M10 11v2h4v-2"></path>
    {% elif name == "bell" %}
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path>
    {% elif name == "search" %}
      <circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path>
    {% elif name == "borrower" %}
      <circle cx="12" cy="7" r="3"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
    {% elif name == "facility" %}
      <path d="M4 21V8l8-4 8 4v13M8 11h2M14 11h2M8 15h2M14 15h2M10 21v-3h4v3"></path>
    {% elif name == "portfolio" %}
      <path d="M4 7h16v13H4zM8 7V4h8v3M4 11h16"></path>
    {% elif name == "covenant" %}
      <path d="M6 3h9l3 3v15H6zM14 3v4h4M9 12h6M9 16h6M9 8h2"></path>
    {% elif name == "certificate" %}
      <circle cx="12" cy="10" r="6"></circle><path d="m8 15-1 6 5-3 5 3-1-6"></path>
    {% elif name == "upload" %}
      <path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"></path>
    {% elif name == "document" %}
      <path d="M6 3h9l3 3v15H6zM14 3v4h4M9 12h6M9 16h4"></path>
    {% elif name == "simulate" %}
      <path d="M5 19 19 5M8 5h11v11M5 13v6h6"></path>
    {% elif name == "audit" %}
      <path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6zM9 12l2 2 4-5"></path>
    {% elif name == "governance" %}
      <path d="M4 21h16M6 18h12M8 18V9M12 18V9M16 18V9M5 9h14L12 3z"></path>
    {% elif name == "admin" %}
      <circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5L9 6.1a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L5 11a7 7 0 0 0 0 2l-2.1 1.5 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.5 3.1h5l.5-3.1a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2.1-1.5a7 7 0 0 0 .1-1z"></path>
    {% elif name == "sun" %}
      <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    {% elif name == "moon" %}
      <path d="M20 15.5A8 8 0 0 1 8.5 4 8 8 0 1 0 20 15.5z"></path>
    {% elif name == "chevron" %}
      <path d="m9 18 6-6-6-6"></path>
    {% elif name == "collapse" %}
      <path d="m14 18-6-6 6-6M20 4v16"></path>
    {% elif name == "user" %}
      <circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>
    {% elif name == "close" %}
      <path d="M6 6l12 12M18 6 6 18"></path>
    {% elif name == "refresh" %}
      <path d="M20 7v5h-5M4 17v-5h5M6.1 8A7 7 0 0 1 18 6l2 6M17.9 16A7 7 0 0 1 6 18l-2-6"></path>
    {% elif name == "arrow" %}
      <path d="M5 12h14M14 7l5 5-5 5"></path>
    {% elif name == "empty" %}
      <path d="M4 13 6.5 5h11L20 13v6H4zM4 13h5l1 2h4l1-2h5"></path>
    {% elif name == "alert" %}
      <path d="M12 4 2.5 20h19zM12 10v4M12 17h.01"></path>
    {% else %}
      <circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path>
    {% endif %}
  </svg>
{%- endmacro %}
